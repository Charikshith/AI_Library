<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resources</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"><link rel="stylesheet" href="../assets/system-design.css"><style>.main .mermaid{display:flex;justify-content:center;margin:24px 0;padding:20px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}.main .mermaid svg{max-width:100%;height:auto}</style></head><body><a href="../../../notes.html" data-ailib-back style="position:fixed;left:16px;bottom:16px;z-index:99999;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:600;background:#0f172a;color:#fff;padding:9px 14px;border-radius:999px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.28)">&#8592; AI Library</a><div class="progress-bar" id="progressBar"></div><header class="topbar"><a class="brand" href="../index.html"><span class="brand-icon">SD</span><span>Mastering System Design</span></a><div class="topbar-actions"><button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button></div></header><div class="overlay" id="overlay"></div><div class="layout"><aside class="sidebar" id="sidebar"><h3>On This Page</h3><ul class="toc-list" id="tocList"></ul></aside><main class="main" id="main"><section class="hero"><span class="chapter-label">Resources</span><h1>Resources</h1><div class="hero-author">By Charikshith</div></section><nav class="chapter-nav"><a class="chapter-nav-card" href="25%20-%20Final%20Prep%2C%20Mindset%20%26%20Moving%20Forward.html"><div class="chapter-nav-label">← Previous</div><div class="chapter-nav-title">Chapter 25 — Final Prep &amp; Mindset</div></a></nav></main></div><script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script><script>const MD="# Youtube\n\n1. [How to Design APIs Like a Senior Engineer (REST, GraphQL, Auth, Security)](https://www.youtube.com/watch?v=7iHl71nt49o)\n\n# Agents\n\n[GOOGLE](https://www.youtube.com/@googlecloudtech/videos)";
var m=document.getElementById("main"),nav=m.querySelector(":scope > .chapter-nav");
var tmp=document.createElement("div");tmp.innerHTML=marked.parse(MD,{gfm:true,breaks:false});
while(tmp.firstChild){m.insertBefore(tmp.firstChild,nav);}
var seen={};
m.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(function(hd){
 if(hd.closest(".hero"))return;
 var id=hd.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu,"").replace(/\s/g,"-");
 if(seen[id]!==undefined){id=id+"-"+(++seen[id]);}else{seen[id]=0;}hd.id=id;});
m.querySelectorAll(":scope > h2").forEach(function(hd){
 if(!/^table of contents$/i.test(hd.textContent.trim()))return;
 var n=hd.nextElementSibling;
 while(n&&n.tagName!=="H2"&&n!==nav){var x=n.nextElementSibling;n.remove();n=x;}
 var p=hd.previousElementSibling;if(p&&p.tagName==="HR")p.remove();hd.remove();});
var toc=document.getElementById("tocList");
m.querySelectorAll(m.querySelector(":scope > h2")?":scope > h2":":scope > h1").forEach(function(hd){
 var li=document.createElement("li"),a=document.createElement("a");
 a.href="#"+hd.id;a.textContent=hd.textContent;li.appendChild(a);toc.appendChild(li);});
m.querySelectorAll("table").forEach(function(t){
 var w=document.createElement("div");w.className="table-wrapper";t.parentNode.insertBefore(w,t);w.appendChild(t);});
m.querySelectorAll(":scope > h2").forEach(function(hd){
 if(!/learning outcomes/i.test(hd.textContent))return;
 var n=hd.nextElementSibling;while(n&&n.tagName==="P")n=n.nextElementSibling;
 if(!n||n.tagName!=="OL")return;n.className="outcomes-list";
 Array.prototype.forEach.call(n.children,function(li,i){
  var s=document.createElement("span");s.innerHTML=li.innerHTML;li.innerHTML="";
  var k=document.createElement("span");k.className="outcome-num";k.textContent=i+1;
  li.appendChild(k);li.appendChild(s);});});
m.querySelectorAll('a[href^="http"]').forEach(function(a){a.target="_blank";a.rel="noopener";});
var dia=[];
m.querySelectorAll("pre > code.language-mermaid").forEach(function(c){
 var d=document.createElement("div");d.className="mermaid";d.textContent=c.textContent;
 c.parentNode.replaceWith(d);dia.push([d,c.textContent]);});
async function drawMermaid(){
 if(!dia.length||typeof mermaid==="undefined")return;
 var dark=document.documentElement.getAttribute("data-theme")==="dark";
 mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:dark?"dark":"default"});
 var nodes=[];
 for(var i=0;i<dia.length;i++){var p=dia[i];
  if(!p[2]&&!(await mermaid.parse(p[1],{suppressErrors:true}))){
   // Invalid diagram source: show it as a code block instead of mermaid's error box.
   var pre=document.createElement("pre"),code=document.createElement("code");
   code.textContent=p[1];pre.appendChild(code);p[0].replaceWith(pre);dia.splice(i--,1);continue;}
  p[2]=true;p[0].removeAttribute("data-processed");p[0].textContent=p[1];nodes.push(p[0]);}
 if(nodes.length)mermaid.run({nodes:nodes});}
window.addEventListener("load",function(){drawMermaid();
 new MutationObserver(drawMermaid).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});});
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script><script src="../assets/system-design.js"></script></body></html>
